        <h1>TerroirTrail — Independent Producer &amp; Agritourism Guide</h1>
        <p><strong>TerroirTrail</strong> is an independent producer and agritourism discovery guide connecting culinary travelers and road-trippers directly with audited producers and projects. Crete and Santorini are the current reference-quality regions, with clearly labeled visiting, location, imagery, and road-access status and no commission markups.</p>
        
        <h2>Discovery Guides &amp; Navigation Safety</h2>
        <p>TerroirTrail publishes Discovery Guides from verified producer stops. Six guides are currently published across Crete and Santorini. They are discovery stop collections, not road-safety guarantees. Multi-stop driving navigation remains withheld wherever road-access evidence is incomplete, and draft guides remain hidden.</p>

        <h2>Verified Crete &amp; Santorini Producer Directory</h2>
        <h3>Crete — Chania</h3>
        <ul>
          <li><strong>Cretan Brewery (Charma Beer)</strong> — Zounaki, Platanias: Fresh, unpasteurized craft beer brewed in an olive grove.</li>
          <li><strong>Lafkas Brewery</strong> — Pazinos, Akrotiri: Belgian-Greek craft brewing fusion with raw orange blossom honey.</li>
          <li><strong>Manousakis Winery</strong> — Vatolakkos: Organic vineyards, Syrah, Roussanne, and indigenous Romeiko.</li>
          <li><strong>Karavitakis Winery</strong> — Pontikiana, Kolymvari: Experimental plots and rare indigenous varieties.</li>
          <li><strong>Anoskeli Winery &amp; Olive Mill</strong> — Anoskeli, Platanias: Combined boutique winery and cold-press olive oil mill.</li>
          <li><strong>Biolea Astrikas Estate</strong> — Astrikas, Platanias: Certified organic olive oil cold-pressed with traditional millstones.</li>
          <li><strong>Olive Tree Museum of Vouves &amp; Monumental Olive Tree</strong> — Ano Vouves, Platanias: Ancient living olive monument and traditional olive culture.</li>
          <li><strong>StathakisFamily Cretan Honey Experience</strong> — Kissamos: Artisanal beekeeping and Cretan thyme honey.</li>
          <li><strong>Wild Herbs of Crete</strong> — Kallikratis: Wild-foraged and cultivated aromatic Cretan herbs and essential oils.</li>
        </ul>

        <h3>Crete — Heraklion</h3>
        <ul>
          <li><strong>Domaine Paterianakis</strong> — Meleses: Certified organic and natural amphora wines (Vidiano, Kotsifali).</li>
          <li><strong>Lyrarakis Winery</strong> — Alagni: Champions of rescued ancient indigenous Cretan varieties (Dafni, Plyto, Melissaki).</li>
          <li><strong>Douloufakis Winery</strong> — Dafnes: Benchmark Vidiano and Dafnes PDO Liatiko.</li>
          <li><strong>Silva Daskalaki Winery</strong> — Siva: Biodynamic viticulture and indigenous Cretan varieties.</li>
          <li><strong>Stilianou Winery</strong> — Kounavi: Boutique organic winery with artisan micro-vinifications.</li>
          <li><strong>Zacharioudakis Organic Winery</strong> — Plouti: Hilltop certified organic vineyard overlooking the Messara plain.</li>
          <li><strong>Titakis Winery</strong> — Kounavi: Family winemaking heritage since 1950.</li>
          <li><strong>Fragospito Winery (Domaine Gavalas)</strong> — Vorias: Family estate winery rooted in traditional Cretan grapes.</li>
          <li><strong>Solo Cretan Craft Brewery</strong> — Kallithea: Uncompromising craft beer and barrel-aged ales.</li>
          <li><strong>KASTA Microbrews</strong> — Heraklion: Urban craft microbrewery championing fresh regional ales.</li>
          <li><strong>Notos Brewery</strong> — Heraklion: Independent craft brewing focused on fresh unpasteurized beers.</li>
          <li><strong>Aerakis Cheese Products</strong> — Sokaras, Gortyna: Traditional Cretan cheese production.</li>
          <li><strong>Meligyris</strong> — Arkalochori: Artisanal raw and varietal Cretan honeys.</li>
          <li><strong>Peskesi Organic Farm</strong> — Haraso, Hersonissos: Sustainable organic farm cultivating heritage crops and culinary biodiversity.</li>
        </ul>

        <h3>Crete — Rethymno</h3>
        <ul>
          <li><strong>Paraschakis Family Olive Oil Factory</strong> — Melidoni: Traditional and modern cold-press olive oil production.</li>
          <li><strong>Tzourmpakis Dairy</strong> — Mixorrouma, Agios Vasileios: Family dairy crafting traditional Cretan graviera and myzithra.</li>
        </ul>

        <h3>Crete — Lasithi</h3>
        <ul>
          <li><strong>Ktima Toplou</strong> — Sitia: Monastic organic viticulture, tsikoudia, and Sitia PDO olive oil. Public tastings at Toplou Fabrica.</li>

        </ul>

        <h2>Frequently Asked Questions</h2>
        <div>
          <h3>What is TerroirTrail?</h3>
          <p>TerroirTrail is an independent producer and agritourism discovery guide connecting culinary travelers and road-trippers directly with independent wineries, craft breweries, artisanal olive mills, traditional dairies, apiaries, traditional distilleries, and farms. Crete and Santorini are the current reference-quality regions.</p>

          <h3>Does TerroirTrail handle bookings or charge commissions?</h3>
          <p>No. TerroirTrail is a discovery-first guide and does not charge booking fees or commissions. Public visitability is shown separately from commercial partnerships. Travelers connect directly with producers via verified producer-controlled contact channels.</p>

          <h3>What categories of producers are included?</h3>
          <p>TerroirTrail supports 13 first-class producer categories: Wineries, Breweries, Distilleries, Cideries, Olive Mills, Olive Oil Producers, Other Oil Mills, Dairies / Cheesemakers, Apiaries / Honey Producers, Confectionery Producers, Herb Farms, Mushroom Farms, and Farms.</p>

          <h3>Which regions are currently audited to reference quality?</h3>
          <p>Crete and Santorini. Crete has 27 audited producer/project records and Santorini has 9 audited producer records.</p>

          <h3>What indigenous grape varieties can I discover in Crete?</h3>
          <p>In Crete, travelers can explore indigenous white grapes including Vidiano, Vilana, Dafni, Plyto, and Melissaki, as well as distinctive red varieties such as Kotsifali, Mandilari, and Liatiko.</p>

          <h3>How is visitability determined for each producer?</h3>
          <p>Each producer listing reflects researched visiting terms: regular public visits, seasonal opening, appointment-only visits, unconfirmed public access, or uncertain access. TerroirTrail distinguishes confirmed public visitor operations from private production facilities, and a map pin is not a guarantee of safe road access for standard rental vehicles.</p>

          <h3>Is TerroirTrail available on mobile devices?</h3>
          <p>Yes. TerroirTrail is available as a responsive web application optimized for mobile and desktop browsers.</p>
