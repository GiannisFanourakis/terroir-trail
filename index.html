        <h1>TerroirTrail — Mediterranean Artisan Agritourism & Wine Guide</h1>
        <p><strong>TerroirTrail</strong> is a curated digital travel platform connecting culinary travelers with 58+ verified independent family wineries, craft microbreweries, artisanal olive oil mills, mountain cheese dairies (mitata), and farm stays across Greece (Crete, Santorini, Peloponnese, Northern Greece) and Italy (Tuscany).</p>
        
        <h2>Curated Self-Drive Day-Trip Loops</h2>
        <ul>
          <li><strong>Heraklion Peza & Archanes Wine Loop (Crete, Greece):</strong> ~45 km • 4-6 hours. Indigenous Vidiano, Kotsifali, Mandilari, and Dafni grape varieties. Key stops include Domaine Paterianakis, Lyrarakis Wines, Douloufakis Winery, and Digenakis Winery.</li>
          <li><strong>Chania Mountain & Artisan Olive Oil Circuit (Crete, Greece):</strong> ~55 km • 4-5 hours. Single-estate Kolymvari PDO Extra Virgin Olive Oil, unfiltered craft beer, and organic mountain vineyards. Key stops include Manousakis Winery (Nostos), Biolea Astrikas Estate (traditional stone mill), Karavitakis Winery, and Cretan Brewery (Charma Beer).</li>
          <li><strong>Chianti Classico Historic Hilltop Trail (Tuscany, Italy):</strong> ~65 km • 5-7 hours. High-elevation Sangiovese (Gallo Nero) DOCG. Key stops include Badia a Coltibuono, Castello di Volpaia, Fontodi, Riecine, and Querciabella.</li>
          <li><strong>Brunello di Montalcino & Val d'Orcia Circuit (Tuscany, Italy):</strong> ~50 km • 5-6 hours. 100% Sangiovese Grosso aged in Slavonian oak. Key stops include Biondi-Santi, Col d'Orcia, Il Poggione, and Altesino.</li>
          <li><strong>Nemea Historic Wine & Olive Trail (Peloponnese, Greece):</strong> ~40 km • 4-5 hours. Legendary Agiorgitiko red wines across limestone mountain terroirs. Key stops include Gaia Wines, Domaine Skouras, and Ktima Semeli.</li>
          <li><strong>Santorini Volcanic Caldera & Ash Vine Trail (Cyclades, Greece):</strong> ~35 km • 4 hours. Century-old ungrafted kouloura basket-pruned vines in volcanic ash, bone-dry Assyrtiko and Vinsanto. Key stops include Domaine Sigalas, Estate Argyros, and Vassaltis Vineyards.</li>
        </ul>

        <h2>Verified Regional Artisan Directory</h2>
        <p>Explore artisan producers across Crete (Heraklion, Chania, Rethymno, Lasithi), Santorini, Peloponnese (Nemea, Mantineia), Northern Greece (Naoussa, Drama), and Tuscany (Chianti, Montalcino, Montepulciano, Bolgheri). Featuring 100% estate-grown raw materials, organic or low-intervention agriculture, and direct producer hospitality with zero booking commissions.</p>
