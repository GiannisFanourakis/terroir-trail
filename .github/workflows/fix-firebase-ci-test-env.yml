name: Fix Firebase CI test environment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-firebase-ci-test-env.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Firebase service tests environment-independent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/firebase.test.ts')
          text = path.read_text(encoding='utf-8')

          marker = "vi.stubEnv('VITE_FIREBASE_PROJECT_ID', 'test-project');\n"
          injection = r'''

// Static ESM imports are evaluated before file-body vi.stubEnv calls. Mock the
// centralized runtime gate itself so this service-security suite always exercises
// the configured/cloud branch in CI without requiring real Firebase credentials.
vi.mock('../config/runtimeConfig', () => ({
  runtimeConfig: {
    firebase: {
      apiKey: 'test-api-key',
      authDomain: 'test.firebaseapp.com',
      projectId: 'test-project',
      storageBucket: '',
      messagingSenderId: '',
      appId: '',
    },
  },
  checkIsFirebaseConfigured: vi.fn(() => true),
}));
'''

          if "vi.mock('../config/runtimeConfig'" not in text:
              if marker not in text:
                  raise SystemExit('Firebase env marker not found')
              text = text.replace(marker, marker + injection, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-firebase-ci-test-env.yml').unlink()
          PY

      - name: Commit deterministic Firebase tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Firebase service tests deterministic in CI"
          git push origin HEAD:main
