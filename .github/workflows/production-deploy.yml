name: Production Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Quality Gate']
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_PUBLIC_ORIGIN: https://terroir-trail.web.app
      STRIPE_PARTNER_BILLING_ENABLED: ${{ vars.STRIPE_PARTNER_BILLING_ENABLED || 'false' }}
      VITE_SUPABASE_URL: https://eoenugkkzmzsrzclvdhl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_W01ZB3X4vjEjW1JFPQCzUw_Kh0AMrbH
      VITE_FIREBASE_API_KEY: AIzaSyBodZLWoi5WVkvqZ-4T7z5hhYBCPR6EiAc
      VITE_FIREBASE_AUTH_DOMAIN: terroir-trail.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: terroir-trail
      VITE_FIREBASE_STORAGE_BUCKET: terroir-trail.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '536226653448'
      VITE_FIREBASE_APP_ID: 1:536226653448:web:dd796c068e38282e1938bd
      VITE_FIREBASE_MEASUREMENT_ID: G-LVZHD0ZFHG
      VITE_GOOGLE_MAPS_API_KEY: AIzaSyAzsaefmksvvAg5Rfp5b7S1sDbLqi1C6lU
      VITE_PUBLIC_APP_URL: https://terroir-trail.web.app
      VITE_ENABLE_EXPLORER_PASS_PURCHASES: 'false'
      VITE_ENABLE_GOOGLE_PLACES_MEDIA: 'true'
      VITE_ENABLE_HOST_MEDIA_UPLOADS: 'true'
      VITE_ENABLE_TRAVEL_AFFILIATES: 'true'
      VITE_ENABLE_ADVERTISING: 'false'
      VITE_ADSENSE_CLIENT_ID: ca-pub-1608902378435149
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51UE7LDPTLRkIE3byut0tGErMGzNZxfBlWi0gZNEBfaX42M6ij4WcYZnBnzgsYldskdWP42fKuNHup87L0sC5jf23009lbjPX9z
      VITE_STRIPE_PRODUCER_UPGRADE_URL: https://buy.stripe.com/8x24gBgpfdUa8zrgnLa7C01
      VITE_STRIPE_EXPLORER_PASS_URL: https://buy.stripe.com/28EaEZeh76rIcPH1sRa7C00
      VITE_STRIPE_ANNUAL_PASS_URL: https://buy.stripe.com/00w6oJa0RaHY2b39Zna7C03

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulator checks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Synchronize active catalogue
        run: npm run sync:seo-catalogue

      - name: Verify exact live catalogue parity
        run: npm run verify:live-catalogue

      - name: Detect generated catalogue changes
        id: generated
        shell: bash
        run: |
          if git diff --quiet -- src/data/liveCatalogue.generated.ts src/data/activeProducerIds.generated.ts src/data/catalogueSummary.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full quality gate on synchronized catalogue
        env:
          VITE_ENABLE_TRAVEL_AFFILIATES: 'false'
          VITE_ENABLE_GOOGLE_PLACES_MEDIA: 'false'
          VITE_ENABLE_HOST_MEDIA_UPLOADS: 'false'
          VITE_ENABLE_EXPLORER_PASS_PURCHASES: 'false'
          VITE_ENABLE_ADVERTISING: 'false'
        run: npm run check

      - name: Run real-browser responsive smoke
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser

      - name: Commit synchronized catalogue snapshot
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "terroirtrail-catalogue-bot"
          git config user.email "102972970+GiannisFanourakis@users.noreply.github.com"
          git add src/data/liveCatalogue.generated.ts src/data/activeProducerIds.generated.ts src/data/catalogueSummary.generated.ts
          git commit -m "Sync active producer catalogue"
          git push origin HEAD:main

      - name: Build final production frontend
        run: npm run build

      - name: Re-verify live catalogue before deployment
        run: npm run verify:live-catalogue

      - name: Authenticate with Google Cloud via GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: terroir-trail
          workload_identity_provider: projects/536226653448/locations/global/workloadIdentityPools/github-actions/providers/terroir-trail
          service_account: terroirtrail-github-deployer@terroir-trail.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # firebase-tools 15.22.2 has a documented ADC/WIF auth regression.
      # Keep CI pinned to the last known-good WIF-compatible release until explicitly upgraded.
      - name: Deploy Firestore rules and indexes
        run: npx -y firebase-tools@15.22.1 deploy --only firestore:rules,firestore:indexes --project terroir-trail --non-interactive

      - name: Deploy Cloud Run API
        shell: bash
        run: |
          gcloud run deploy terroirtrail-api \
            --source . \
            --project=terroir-trail \
            --region=europe-west1 \
            --min-instances=0 \
            --max-instances=3 \
            --cpu=1 \
            --memory=512Mi \
            --update-env-vars=APP_URL=https://terroir-trail.web.app,STRIPE_PARTNER_ANNUAL_PRICE_ID=price_1UIkraPTLRkIE3byfmvTRhAt,STRIPE_PARTNER_BILLING_ENABLED=${STRIPE_PARTNER_BILLING_ENABLED},EXPLORER_PASS_CHECKOUT_ENABLED=false \
            --update-secrets=STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=terroirtrail-stripe-webhook-secret:latest \
            --quiet

      - name: Verify direct Cloud Run API health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://terroirtrail-api-mqznli4emq-ew.a.run.app/api/health

      - name: Deploy Firebase Hosting
        run: npx -y firebase-tools@15.22.1 deploy --only hosting --project terroir-trail --non-interactive

      - name: Verify Firebase API rewrite health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://terroir-trail.web.app/api/health

      - name: Verify public production surface
        run: npm run smoke:public

      - name: Verify public production UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run smoke:production-ui

      - name: Verify deployed catalogue hash
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const local = JSON.parse(fs.readFileSync('dist/catalogue-state.json', 'utf8'));
          const response = await fetch(
            `https://terroir-trail.web.app/catalogue-state.json?t=${Date.now()}`,
            { cache: 'no-store' }
          );
          if (!response.ok) throw new Error(`catalogue-state.json returned HTTP ${response.status}`);
          const remote = await response.json();
          if (remote.catalogueHash !== local.catalogueHash) {
            throw new Error(`Deployed catalogue hash ${remote.catalogueHash} does not match local ${local.catalogueHash}`);
          }
          console.log(`Deployed catalogue hash verified: ${local.catalogueHash}`);
          NODE

      - name: Detect IndexNow-relevant production changes
        id: indexnow
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD || true)"
          printf '%s\n' "$changed_files"

          submit=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              public/5d8e7c2a4b1f6093c8e5a7d2f4b6c901.txt|\
              public/methodology/*|\
              scripts/generate_seo_pages.ts|\
              scripts/generate_seo_landings.ts|\
              scripts/enrich_producer_aeo.ts|\
              scripts/enrich_seo_destination_stories.ts|\
              scripts/finalize_phase12_homepage.ts|\
              scripts/finalize_llms_catalogue.ts|\
              scripts/finalize_seo_landing_indexes.ts|\
              scripts/submit_indexnow.mjs|\
              src/data/liveCatalogue.generated.ts|\
              src/data/activeProducerIds.generated.ts|\
              src/data/catalogueSummary.generated.ts|\
              src/data/terroirRegionStories*|\
              .github/workflows/production-deploy.yml)
                submit=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "submit=$submit" >> "$GITHUB_OUTPUT"

      - name: Submit priority SEO URLs to IndexNow
        if: steps.indexnow.outputs.submit == 'true'
        continue-on-error: true
        run: node scripts/submit_indexnow.mjs

      - name: Deployment summary
        run: |
          echo "Production deployment completed from $(git rev-parse --short HEAD)."
          echo "Future successful pushes to main deploy Firestore, Cloud Run, and Hosting automatically."
