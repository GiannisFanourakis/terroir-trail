name: Cloud Asset Artisan (Clio)

on:
  workflow_dispatch:
    inputs:
      carousel_script:
        description: 'Path to Python carousel generator script'
        required: true
        default: 'tools/python/build_carousel.py'
      output_folder:
        description: 'Output directory for rendered PNG slides'
        required: true
        default: 'staging/carousel_output'

jobs:
  render_carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Graphic Dependencies
        run: |
          pip install pillow requests

      - name: Execute Cloud Asset Rendering
        run: |
          mkdir -p "${{ github.event.inputs.output_folder }}"
          python "${{ github.event.inputs.carousel_script }}" || echo "Execution completed."

      - name: Upload Rendered Slides Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-carousel-slides
          path: "${{ github.event.inputs.output_folder }}/*.png"
          retention-days: 14
