name: Production Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ['Quality Gate']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: production-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Public client configuration. These values are already delivered to browsers
      # by the production bundle; private deploy credentials remain GitHub secrets.
      VITE_SUPABASE_URL: https://eoenugkkzmzsrzclvdhl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_W01ZB3X4vjEjW1JFPQCzUw_Kh0AMrbH
      VITE_FIREBASE_API_KEY: AIzaSyBodZLWoi5WVkvqZ-4T7z5hhYBCPR6EiAc
      VITE_FIREBASE_AUTH_DOMAIN: terroir-trail.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: terroir-trail
      VITE_FIREBASE_STORAGE_BUCKET: terroir-trail.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '536226653448'
      VITE_FIREBASE_APP_ID: 1:536226653448:web:dd796c068e38282e1938bd
      VITE_FIREBASE_MEASUREMENT_ID: G-LVZHD0ZFHG
      VITE_GOOGLE_MAPS_API_KEY: AIzaSyAzsaefmksvvAg5Rfp5b7S1sDbLqi1C6lU
      VITE_PUBLIC_APP_URL: https://terroir-trail.web.app
      VITE_ENABLE_EXPLORER_PASS_PURCHASES: 'false'
      VITE_ENABLE_GOOGLE_PLACES_MEDIA: 'true'
      VITE_ENABLE_HOST_MEDIA_UPLOADS: 'true'
      VITE_ENABLE_TRAVEL_AFFILIATES: 'true'
      VITE_ENABLE_ADVERTISING: 'false'
      VITE_ADSENSE_CLIENT_ID: ca-pub-1608902378435149
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51UE7LDPTLRkIE3byut0tGErMGzNZxfBlWi0gZNEBfaX42M6ij4WcYZnBnzgsYldskdWP42fKuNHup87L0sC5jf23009lbjPX9z
      VITE_STRIPE_PRODUCER_UPGRADE_URL: https://buy.stripe.com/8x24gBgpfdUa8zrgnLa7C01
      VITE_STRIPE_EXPLORER_PASS_URL: https://buy.stripe.com/28EaEZeh76rIcPH1sRa7C00
      VITE_STRIPE_ANNUAL_PASS_URL: https://buy.stripe.com/00w6oJa0RaHY2b39Zna7C03
      SMOKE_PUBLIC_ORIGIN: https://terroir-trail.web.app
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERROIR_TRAIL }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulator checks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Synchronize active catalogue
        run: npm run sync:seo-catalogue

      - name: Verify exact live catalogue parity
        run: npm run verify:live-catalogue

      - name: Detect generated catalogue changes
        id: generated
        shell: bash
        run: |
          if git diff --quiet --             src/data/liveCatalogue.generated.ts             src/data/activeProducerIds.generated.ts             src/data/catalogueSummary.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full quality gate on synchronized catalogue
        env:
          # Match the neutral Quality Gate environment. Production feature flags
          # are restored automatically for the later final rebuild/deploy step.
          VITE_ENABLE_TRAVEL_AFFILIATES: 'false'
          VITE_ENABLE_GOOGLE_PLACES_MEDIA: 'false'
          VITE_ENABLE_HOST_MEDIA_UPLOADS: 'false'
          VITE_ENABLE_EXPLORER_PASS_PURCHASES: 'false'
          VITE_ENABLE_ADVERTISING: 'false'
        run: npm run check

      - name: Run real-browser responsive smoke
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser

      - name: Commit synchronized catalogue snapshot
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "terroirtrail-catalogue-bot"
          git config user.email "102972970+GiannisFanourakis@users.noreply.github.com"
          git add src/data/liveCatalogue.generated.ts src/data/activeProducerIds.generated.ts src/data/catalogueSummary.generated.ts
          git commit -m "Sync active producer catalogue"
          git push origin HEAD:main

      - name: Rebuild from final commit
        run: npm run build

      - name: Re-verify live catalogue immediately before deploy decision
        run: npm run verify:live-catalogue

      - name: Compare production state
        id: production
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const localVersion = JSON.parse(fs.readFileSync('dist/version.json', 'utf8'));
          const localState = JSON.parse(fs.readFileSync('dist/catalogue-state.json', 'utf8'));

          async function readJson(url) {
            try {
              const response = await fetch(url, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' },
              });
              if (!response.ok) return null;
              return await response.json();
            } catch {
              return null;
            }
          }

          const nonce = Date.now();
          const remoteVersion = await readJson(`https://terroir-trail.web.app/version.json?t=${nonce}`);
          const remoteState = await readJson(`https://terroir-trail.web.app/catalogue-state.json?t=${nonce}`);

          const synchronized =
            remoteVersion?.commit === localVersion.commit &&
            remoteState?.catalogueHash === localState.catalogueHash;

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `deploy=${synchronized ? 'false' : 'true'}\n`
          );

          console.log(
            synchronized
              ? `Production already synchronized at commit ${localVersion.commit} / catalogue ${localState.catalogueHash.slice(0, 12)}…`
              : `Production drift detected; deploy required for commit ${localVersion.commit} / catalogue ${localState.catalogueHash.slice(0, 12)}…`
          );
          NODE

      - name: Authenticate with Google Cloud
        if: steps.production.outputs.deploy == 'true' && env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy synchronized Firebase Hosting build
        if: steps.production.outputs.deploy == 'true'
        shell: bash
        run: |
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            npx -y firebase-tools deploy --only hosting --project terroir-trail --non-interactive
          elif [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            npx -y firebase-tools deploy --only hosting --project terroir-trail --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::error::Automatic deployment needs either FIREBASE_SERVICE_ACCOUNT_TERROIR_TRAIL or FIREBASE_TOKEN configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Verify public production surface
        if: steps.production.outputs.deploy == 'true'
        run: npm run smoke:public

      - name: Verify public production UI
        if: steps.production.outputs.deploy == 'true'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run smoke:production-ui

      - name: Verify deployed catalogue hash
        if: steps.production.outputs.deploy == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const local = JSON.parse(fs.readFileSync('dist/catalogue-state.json', 'utf8'));
          const response = await fetch(
            `https://terroir-trail.web.app/catalogue-state.json?t=${Date.now()}`,
            { cache: 'no-store' }
          );
          if (!response.ok) throw new Error(`catalogue-state.json returned HTTP ${response.status}`);
          const remote = await response.json();
          if (remote.catalogueHash !== local.catalogueHash) {
            throw new Error(
              `Deployed catalogue hash ${remote.catalogueHash} does not match local ${local.catalogueHash}`
            );
          }
          console.log(`Deployed catalogue hash verified: ${local.catalogueHash}`);
          NODE
