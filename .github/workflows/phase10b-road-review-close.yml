name: Phase 10B Road Review Close

# Registered on main; this update triggers the one-time parity patch.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase10b-road-review-close.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Phase 10B road review close parity
        run: python scripts/patch_phase10b_road_review_close.py

      - name: Commit parity changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/phase10bProducers.ts src/data/phase10bProducerTaxonomy.test.ts reports/phase10b_peloponnese_northern_greece_tuscany.md
          git diff --cached --quiet && exit 0
          git commit -m 'Close Phase 10B public road evidence review'
          git push origin HEAD:main
