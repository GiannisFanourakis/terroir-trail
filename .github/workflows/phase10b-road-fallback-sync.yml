name: Phase 10B Road Fallback Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase10b-road-fallback-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply road fallback parity
        run: python scripts/patch_phase10b_road_fallback.py

      - name: Commit parity changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/phase10bProducers.ts src/data/phase10bProducerTaxonomy.test.ts reports/phase10b_peloponnese_northern_greece_tuscany.md
          git diff --cached --quiet && exit 0
          git commit -m 'Sync Phase 10B road audit batch 1 fallback'
          git push origin HEAD:main
