name: Fix Phase 10B regression tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-phase10b-regression-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align stale tests with audited Phase 10B state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/phase8ProducerPresentation.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "expect(html).toContain('does not guarantee a paved entrance or standard rental-car road');"
          new = "expect(html).toContain('does not by itself establish road conditions or the location of every production asset');"
          if old not in text:
              raise SystemExit('phase8 stale assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('src/components/verificationIntegrity.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "expect(htmlTab3).toContain('The precise visitor entrance for this producer is still being verified');"
          new = "expect(htmlTab3).toContain('The precise public point for this producer is still being verified');"
          if old not in text:
              raise SystemExit('verification stale assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('src/services/googlePlacesUiKit.test.ts')
          text = path.read_text(encoding='utf-8')
          import_marker = "import { SANTORINI_PRODUCERS } from '../data/santoriniProducers';\n"
          if "../data/phase10bProducers" not in text:
              text = text.replace(
                  import_marker,
                  import_marker + "import { PHASE10B_PRODUCERS } from '../data/phase10bProducers';\n",
              )
          text = text.replace(
              "const AUDITED_REGIONAL_PRODUCERS = [\n  ...CRETAN_PRODUCERS,\n  ...SANTORINI_PRODUCERS,\n];",
              "const AUDITED_REGIONAL_PRODUCERS = [\n  ...CRETAN_PRODUCERS,\n  ...SANTORINI_PRODUCERS,\n  ...PHASE10B_PRODUCERS,\n];\n\nconst EXPECTED_GOOGLE_PLACES_PRODUCERS = AUDITED_REGIONAL_PRODUCERS.filter(\n  (producer) =>\n    Boolean(producer.googlePlaceId?.trim()) &&\n    (producer.locationStatus === 'verified_location' ||\n      producer.locationStatus === 'verified_entrance')\n);"
          )
          text = text.replace(
              "it('covers all audited Crete and Santorini producers across supported categories', () => {",
              "it('covers every audited producer with a verified location and persistent Google Place ID', () => {"
          )
          old_block = """      expect(CRETAN_PRODUCERS).toHaveLength(27);\n      expect(SANTORINI_PRODUCERS).toHaveLength(9);\n      expect(GOOGLE_PLACES_PROTOTYPE_ITEMS).toHaveLength(36);\n      expect(GOOGLE_PLACES_PROTOTYPE_ALLOWLIST).toHaveLength(36);"""
          new_block = """      expect(CRETAN_PRODUCERS).toHaveLength(27);\n      expect(SANTORINI_PRODUCERS).toHaveLength(9);\n      expect(PHASE10B_PRODUCERS).toHaveLength(19);\n      expect(GOOGLE_PLACES_PROTOTYPE_ITEMS).toHaveLength(\n        EXPECTED_GOOGLE_PLACES_PRODUCERS.length\n      );\n      expect(GOOGLE_PLACES_PROTOTYPE_ALLOWLIST).toHaveLength(\n        EXPECTED_GOOGLE_PLACES_PRODUCERS.length\n      );\n      expect(GOOGLE_PLACES_PROTOTYPE_ALLOWLIST).toEqual(\n        EXPECTED_GOOGLE_PLACES_PRODUCERS.map((producer) => producer.id)\n      );"""
          if old_block not in text:
              raise SystemExit('google places stale count block not found')
          path.write_text(text.replace(old_block, new_block), encoding='utf-8')

          path = Path('src/services/producerService.test.ts')
          text = path.read_text(encoding='utf-8')
          import_marker = "import { SANTORINI_PRODUCERS } from '../data/santoriniProducers';\n"
          if "../data/phase10bProducers" not in text:
              text = text.replace(
                  import_marker,
                  import_marker + "import { PHASE10B_PRODUCERS } from '../data/phase10bProducers';\n",
              )
          old = "const EXPECTED_FALLBACK_COUNT = CRETAN_PRODUCERS.length + SANTORINI_PRODUCERS.length;"
          new = """const EXPECTED_FALLBACK_COUNT =\n  CRETAN_PRODUCERS.length +\n  SANTORINI_PRODUCERS.length +\n  PHASE10B_PRODUCERS.length;"""
          if old not in text:
              raise SystemExit('producer service stale fallback count not found')
          text = text.replace(old, new)
          text = text.replace(
              '// Verify single producer fetches from both audited fallback regions',
              '// Verify single producer fetches across audited fallback regions'
          )
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/fix-phase10b-regression-tests.yml').unlink()
          PY

      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align tests with Phase 10B audited catalogue"
          git push origin HEAD:main
