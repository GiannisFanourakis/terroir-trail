name: Quality Gate

# Run the repository's canonical quality gate before merge and again on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Harmless test-only client values. They ensure mocked Firebase service tests
      # exercise the configured/cloud branch in CI without using real credentials.
      VITE_FIREBASE_API_KEY: ci-test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-test-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run full quality gate
        run: npm run check
