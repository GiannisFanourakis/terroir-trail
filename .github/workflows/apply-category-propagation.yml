name: Apply category propagation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-category-propagation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply precise source fixes
        shell: python
        run: |
          from pathlib import Path

          reg = Path('src/components/Portal/ProducerRegistrationForm.tsx')
          text = reg.read_text(encoding='utf-8')
          text = text.replace(
              "  if (effectiveCat === 'olive_mill') return 'olive_oil';",
              "  if (effectiveCat === 'olive_mill' || effectiveCat === 'olive_oil_producer') return 'olive_oil';"
          )
          marker = "type TabKey = 'fiscal' | 'logistics' | 'packaging' | 'banking' | 'permits';\n"
          helper = """

const getDestinationLabel = (destination?: Producer['destination']): string => {
  switch (destination) {
    case 'crete': return 'Crete';
    case 'santorini': return 'Santorini';
    case 'peloponnese': return 'Peloponnese';
    case 'northern_greece': return 'Northern Greece';
    case 'tuscany': return 'Tuscany';
    default: return '';
  }
};
"""
          if 'const getDestinationLabel' not in text:
              text = text.replace(marker, marker + helper)
          text = text.replace(
              "defaultProducer ? (defaultProducer.destination === 'tuscany' ? 'Tuscany' : 'Crete') : 'Crete'",
              "defaultProducer ? getDestinationLabel(defaultProducer.destination) : ''"
          )
          text = text.replace(
              "setRegion(initial.destination === 'tuscany' ? 'Tuscany' : 'Crete');",
              "setRegion(getDestinationLabel(initial.destination));"
          )
          text = text.replace(
              "setRegion(p.destination === 'tuscany' ? 'Tuscany' : 'Crete');",
              "setRegion(getDestinationLabel(p.destination));"
          )
          text = text.replace(
              "{p.name} ({p.village}, {p.destination === 'tuscany' ? 'Tuscany' : 'Crete'})",
              "{p.name} ({p.village}, {getDestinationLabel(p.destination)})"
          )
          text = text.replace(
              '<option value="olive_oil">🫒 Cold-Pressed Olive Mill</option>',
              '<option value="olive_oil">🫒 Olive Oil Producer / Mill</option>'
          )
          reg.write_text(text, encoding='utf-8')

          exp = Path('src/data/experiences.ts')
          text = exp.read_text(encoding='utf-8')
          if 'olive_oil_producer: []' not in text:
              text = text.replace(
                  "\n\n  apiary: [",
                  "\n\n  // No synthetic default experiences for olive-oil producers.\n  // Experiences stay empty until explicit producer-approved offerings exist.\n  olive_oil_producer: [],\n\n  apiary: [",
                  1,
              )
          exp.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-category-propagation.yml').unlink()

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete olive oil producer category propagation"
          git push origin HEAD:main
