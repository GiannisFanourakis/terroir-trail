name: Apply Thessaly region wiring

on:
  push:
    paths:
      - '.github/workflows/apply-thessaly-region.yml'

permissions:
  contents: write

jobs:
  wire-thessaly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Thessaly into app
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          # App and map use the app-facing catalogue that adds Thessaly without
          # touching the large legacy region geometry bundle.
          replace_once(
              'src/App.tsx',
              "import { TERROIR_REGIONS } from './data/terroirRegions';",
              "import { TERROIR_REGIONS } from './data/terroirRegionCatalogue';",
          )
          replace_once(
              'src/components/Map/MapCanvas.tsx',
              "import { TERROIR_REGIONS, TerroirRegion } from '../../data/terroirRegions';",
              "import { TERROIR_REGIONS, type TerroirRegion } from '../../data/terroirRegionCatalogue';",
          )
          replace_once(
              'src/components/Map/MapCanvas.tsx',
              "    peloponnese: { coords: [37.8280, 22.6580], zoom: 10 },\n    northern_greece:",
              "    peloponnese: { coords: [37.8280, 22.6580], zoom: 10 },\n    thessaly: { coords: [39.592714, 22.056567], zoom: 9 },\n    northern_greece:",
          )

          # Clean two strict-typing issues exposed by a full build.
          replace_once(
              'src/components/Map/MapCanvas.tsx',
              "          const isSelected = countryScope === country && countryScope !== 'all';",
              "          const isSelected = countryScope === country;",
          )
          replace_once(
              'src/components/Map/MapCanvas.tsx',
              "            const element = (featureLayer as L.Path).getElement?.();\n            if (element) element.style.cursor = 'pointer';",
              "            const element = (featureLayer as L.Path).getElement?.() as HTMLElement | SVGElement | null;\n            if (element) element.style.cursor = 'pointer';",
          )

          # Region navigation menu.
          replace_once(
              'src/components/Header/Header.tsx',
              "    { id: 'peloponnese', label: 'Peloponnese', flag: '🏛️' },\n    { id: 'northern_greece'",
              "    { id: 'peloponnese', label: 'Peloponnese', flag: '🏛️' },\n    { id: 'thessaly', label: 'Thessaly', flag: '🌾' },\n    { id: 'northern_greece'",
          )

          # Keep the story registry exhaustive so existing tests stay strict,
          # while sourcing Thessaly's story from its region definition.
          replace_once(
              'src/data/terroirRegionStories.ts',
              "import type { TerroirRegion, TerroirRegionSection } from './terroirRegions';",
              "import type { TerroirRegion, TerroirRegionSection } from './terroirRegions';\nimport { THESSALY_TERROIR_REGION } from './thessalyRegion';",
          )
          replace_once(
              'src/data/terroirRegionStories.ts',
              "\n  northern_greece: {",
              "\n  thessaly: {\n    eyebrow: THESSALY_TERROIR_REGION.eyebrow,\n    summary: THESSALY_TERROIR_REGION.summary,\n    highlights: THESSALY_TERROIR_REGION.highlights,\n    sections: THESSALY_TERROIR_REGION.sections,\n  },\n\n  northern_greece: {",
          )

          # The one-shot workflow deletes itself after applying the patch.
          Path('.github/workflows/apply-thessaly-region.yml').unlink()

      - name: Validate TypeScript build
        run: |
          npm ci
          npm run build

      - name: Commit Thessaly wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Map/MapCanvas.tsx src/components/Header/Header.tsx src/data/terroirRegionStories.ts .github/workflows/apply-thessaly-region.yml
          git commit -m "Complete Thessaly region app wiring"
          git push
